<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Pengaturan akun LoraField.">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <script>
        try {
            document.documentElement.dataset.theme = localStorage.getItem('lf_theme') === 'light' ? 'light' : 'dark';
        } catch (error) {
            document.documentElement.dataset.theme = 'dark';
        }
    </script>
    <title>Pengaturan Akun - LoraField</title>
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/premium.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </noscript>
</head>

<body>
    <div class="ambient-bg"><div class="ambient-orb orb-1"></div><div class="ambient-orb orb-2"></div><div class="ambient-orb orb-3"></div></div>
    <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
        <div class="sidebar-brand"><h2 class="sidebar-brand-title"><img src="img/logo.svg" class="brand-logo" alt=""><span class="brand-name">LoraField</span></h2></div>
        <nav class="sidebar-nav" aria-label="Menu aplikasi"></nav>
        <div class="sidebar-footer">LoraField v1.5 Beta &middot; CDP 2026</div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-toggle" id="sidebar-toggle" type="button" aria-label="Buka navigasi" aria-controls="sidebar"><i class="fas fa-bars" aria-hidden="true"></i></button>
            </div>
            <div class="topbar-right"><span class="topbar-clock" id="realtime-clock"></span></div>
        </header>

        <div class="page-content settings-page">
            <section class="settings-section" aria-labelledby="settings-profile-title">
                <h3 class="settings-section-title" id="settings-profile-title">Profil Akun</h3>
                <div class="settings-profile-flat">
                    <div class="settings-field">
                        <span class="settings-field-label">Nama</span>
                        <span class="settings-field-value" id="settings-user-name">-</span>
                    </div>
                    <div class="settings-field">
                        <span class="settings-field-label">Email</span>
                        <span class="settings-field-value" id="settings-user-email">-</span>
                    </div>
                    <div class="settings-field settings-field-editable">
                        <span class="settings-field-label">Nomor Handphone</span>
                        <div class="settings-phone-row" id="settings-phone-view">
                            <span class="settings-field-value" id="settings-user-phone">-</span>
                            <button class="settings-edit-btn" type="button" id="settings-phone-edit-btn" aria-label="Edit nomor handphone">
                                <i class="fas fa-pen" aria-hidden="true"></i>
                            </button>
                        </div>
                        <div class="settings-phone-row settings-phone-edit-row" id="settings-phone-edit" hidden>
                            <input class="form-control settings-phone-input" type="tel" id="settings-phone-input"
                                placeholder="Contoh: 08123456789" maxlength="20" autocomplete="tel">
                            <button class="btn btn-primary btn-sm" type="button" id="settings-phone-save-btn">Simpan</button>
                            <button class="btn btn-secondary btn-sm" type="button" id="settings-phone-cancel-btn">Batal</button>
                        </div>
                        <p class="settings-phone-feedback" id="settings-phone-feedback" hidden></p>
                    </div>
                </div>
                <div class="settings-actions settings-profile-actions">
                    <button class="btn btn-secondary" type="button" id="settings-change-password">
                        <i class="fas fa-key" aria-hidden="true"></i> Ganti Sandi
                    </button>
                    <button class="btn btn-danger" type="button" id="settings-logout">
                        <i class="fas fa-right-from-bracket" aria-hidden="true"></i> Keluar
                    </button>
                </div>
            </section>
        </div>
    </main>

    <script src="js/dummy-data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        function storeUserProfile(user) {
            try {
                const merged = Object.assign({}, getCurrentUserProfile(), user || {});
                localStorage.setItem('lf_user', JSON.stringify(merged));
                return merged;
            } catch (_) {
                return user || {};
            }
        }

        function renderAccountSettings(user = getCurrentUserProfile()) {
            document.getElementById('settings-user-name').textContent = user.name || 'Tidak tersedia';
            document.getElementById('settings-user-email').textContent = user.email || 'Tidak tersedia';
            document.getElementById('settings-user-phone').textContent = user.phone || '-';
        }

        async function loadAccountSettings() {
            renderAccountSettings();
            if (!getAuthHeaders().Authorization) return;

            try {
                const res = await fetch(`${API_BASE}/api/auth/me`, { headers: getAuthHeaders() });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    if (res.status === 401) window.location.href = 'login.html';
                    return;
                }
                renderAccountSettings(storeUserProfile(data));
            } catch (_) {
                // Tetap tampilkan profil terakhir dari localStorage jika backend belum terhubung.
            }
        }

        function setPhoneFeedback(msg, type) {
            const el = document.getElementById('settings-phone-feedback');
            el.hidden = false;
            el.className = `settings-phone-feedback forgot-feedback-${type}`;
            el.textContent = msg;
        }

        document.getElementById('settings-phone-edit-btn').addEventListener('click', () => {
            const current = document.getElementById('settings-user-phone').textContent;
            document.getElementById('settings-phone-input').value = current === '-' ? '' : current;
            document.getElementById('settings-phone-view').hidden = true;
            document.getElementById('settings-phone-edit').hidden = false;
            document.getElementById('settings-phone-feedback').hidden = true;
            document.getElementById('settings-phone-input').focus();
        });

        document.getElementById('settings-phone-cancel-btn').addEventListener('click', () => {
            document.getElementById('settings-phone-view').hidden = false;
            document.getElementById('settings-phone-edit').hidden = true;
            document.getElementById('settings-phone-feedback').hidden = true;
        });

        document.getElementById('settings-phone-save-btn').addEventListener('click', async () => {
            const phone = document.getElementById('settings-phone-input').value.trim();
            const saveBtn = document.getElementById('settings-phone-save-btn');
            saveBtn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/api/auth/profile`, {
                    method: 'PATCH',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ phone })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    setPhoneFeedback(data.detail || 'Gagal menyimpan.', 'error');
                    return;
                }
                renderAccountSettings(storeUserProfile(data.user || {}));
                document.getElementById('settings-phone-view').hidden = false;
                document.getElementById('settings-phone-edit').hidden = true;
                document.getElementById('settings-phone-feedback').hidden = true;
            } catch (_) {
                setPhoneFeedback('Tidak bisa terhubung ke backend.', 'error');
            } finally {
                saveBtn.disabled = false;
            }
        });

        document.getElementById('settings-logout').addEventListener('click', () => {
            removeLocalStorage('lf_auth_demo');
            removeLocalStorage('lf_selected_farm');
            removeLocalStorage('lf_access_token');
            removeLocalStorage('lf_token_type');
            removeLocalStorage('lf_user');
            removeLocalStorage('lf_threshold_lower');
            removeLocalStorage('lf_threshold_upper');
            removeLocalStorage('lf_valve_state');
            window.location.href = 'login.html';
        });

        document.getElementById('settings-change-password').addEventListener('click', () => {
            window.location.href = 'change-password.html';
        });

        document.addEventListener('DOMContentLoaded', loadAccountSettings);
    </script>
</body>

</html>

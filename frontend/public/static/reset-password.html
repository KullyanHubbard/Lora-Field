<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Atur ulang password akun LoraField.">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <script>
        try {
            document.documentElement.dataset.theme = localStorage.getItem('lf_theme') === 'light' ? 'light' : 'dark';
        } catch (error) {
            document.documentElement.dataset.theme = 'dark';
        }
    </script>
    <title>Reset Password - LoraField</title>
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/premium.css">
</head>

<body class="auth-page">
    <header class="auth-brand-bar" aria-label="LoraField branding">
        <div class="auth-brand-link">
            <span class="auth-brand-name">LoraField</span>
        </div>
        <div class="auth-theme-slot" aria-label="Pengaturan tema"></div>
    </header>
    <main class="login-shell" aria-labelledby="reset-title">
        <section class="login-card login-card-center" aria-label="Form reset password">
            <div class="login-intro">
                <h1 id="reset-title">Atur Ulang Password</h1>
                <p>Verifikasi kode reset 6 digit terlebih dahulu, lalu buat password baru Anda.</p>
            </div>

            <form id="reset-form" class="login-form">
                <div class="form-group">
                    <label for="reset-token">Kode Reset (6 Digit)</label>
                    <input class="form-control" type="text" id="reset-token" name="token"
                        autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                        placeholder="Contoh: 123456" required>
                </div>
                <button class="forgot-link" id="change-code-button" type="button" hidden>
                    Ganti Kode
                </button>
                <section id="password-step" hidden>
                    <div class="form-group">
                        <label for="reset-password">Password Baru</label>
                        <div class="password-field">
                            <input class="form-control password-input" type="password" id="reset-password"
                                autocomplete="new-password" placeholder="Minimal 6 karakter">
                            <button class="password-toggle" type="button" data-target="reset-password"
                                aria-label="Tampilkan password" aria-pressed="false">
                                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                    <g class="icon-eye-open">
                                        <path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7-10-7-10-7Z" />
                                        <circle cx="12" cy="12" r="3.2" />
                                    </g>
                                    <g class="icon-eye-closed password-icon-state-hidden">
                                        <path d="M3 3l18 18" />
                                        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                                        <path d="M9.9 5.2A10.6 10.6 0 0 1 12 5c6.2 0 10 7 10 7a17.3 17.3 0 0 1-3.2 4.2" />
                                        <path d="M6.3 6.3A17 17 0 0 0 2 12s3.8 7 10 7c1.3 0 2.4-.2 3.5-.6" />
                                    </g>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="reset-confirm-password">Ulangi Password Baru</label>
                        <div class="password-field">
                            <input class="form-control password-input" type="password" id="reset-confirm-password"
                                autocomplete="new-password" placeholder="Ulangi password baru">
                            <button class="password-toggle" type="button" data-target="reset-confirm-password"
                                aria-label="Tampilkan password" aria-pressed="false">
                                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                    <g class="icon-eye-open">
                                        <path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7-10-7-10-7Z" />
                                        <circle cx="12" cy="12" r="3.2" />
                                    </g>
                                    <g class="icon-eye-closed password-icon-state-hidden">
                                        <path d="M3 3l18 18" />
                                        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                                        <path d="M9.9 5.2A10.6 10.6 0 0 1 12 5c6.2 0 10 7 10 7a17.3 17.3 0 0 1-3.2 4.2" />
                                        <path d="M6.3 6.3A17 17 0 0 0 2 12s3.8 7 10 7c1.3 0 2.4-.2 3.5-.6" />
                                    </g>
                                </svg>
                            </button>
                        </div>
                    </div>
                </section>
                <button class="btn btn-primary login-submit" type="submit">
                    <span id="reset-submit-label">Verifikasi Kode</span>
                </button>
                <p class="forgot-feedback" id="reset-feedback" role="status" aria-live="polite" hidden></p>

                <div class="auth-divider" aria-hidden="true"><span>atau</span></div>

                <p class="auth-switch">
                    Kembali ke
                    <a class="auth-switch-link" href="login.html">Masuk</a>
                </p>
            </form>
        </section>
    </main>

    <script src="js/main.js"></script>
    <script>
        const API_BASE = (() => {
            const manualBase = localStorage.getItem('lf_api_base');
            if (manualBase) return manualBase;
            if (window.location.port === '8000') return window.location.origin;
            return 'http://localhost:8000';
        })();

        const resetForm = document.getElementById('reset-form');
        const resetToken = document.getElementById('reset-token');
        const resetPassword = document.getElementById('reset-password');
        const resetConfirmPassword = document.getElementById('reset-confirm-password');
        const resetFeedback = document.getElementById('reset-feedback');
        const passwordStep = document.getElementById('password-step');
        const changeCodeButton = document.getElementById('change-code-button');
        const submitLabel = document.getElementById('reset-submit-label');
        const passwordToggles = document.querySelectorAll('.password-toggle');
        let codeVerified = false;
        let verifiedToken = '';

        function setResetFeedback(message, type) {
            resetFeedback.hidden = false;
            resetFeedback.className = `forgot-feedback forgot-feedback-${type}`;
            resetFeedback.textContent = message;
        }

        function openPasswordStep(token) {
            codeVerified = true;
            verifiedToken = token;
            resetToken.readOnly = true;
            passwordStep.hidden = false;
            changeCodeButton.hidden = false;
            submitLabel.textContent = 'Perbarui Password';
            setResetFeedback('Kode valid. Silakan masukkan password baru Anda.', 'success');
            resetPassword.focus();
        }

        function resetToCodeStep() {
            codeVerified = false;
            verifiedToken = '';
            resetToken.readOnly = false;
            passwordStep.hidden = true;
            changeCodeButton.hidden = true;
            submitLabel.textContent = 'Verifikasi Kode';
            resetPassword.value = '';
            resetConfirmPassword.value = '';
            setResetFeedback('Masukkan kode reset yang benar, lalu verifikasi kembali.', 'success');
            resetToken.focus();
        }

        changeCodeButton.addEventListener('click', resetToCodeStep);

        passwordToggles.forEach(toggle => {
            toggle.addEventListener('click', () => {
                const targetId = toggle.getAttribute('data-target');
                const input = document.getElementById(targetId);
                if (!input) return;
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                toggle.setAttribute('aria-pressed', String(show));
                toggle.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
                const openIcon = toggle.querySelector('.icon-eye-open');
                const closedIcon = toggle.querySelector('.icon-eye-closed');
                if (openIcon) openIcon.classList.toggle('password-icon-state-hidden', show);
                if (closedIcon) closedIcon.classList.toggle('password-icon-state-hidden', !show);
            });
        });

        resetForm.addEventListener('submit', async event => {
            event.preventDefault();

            const token = resetToken.value.trim();
            const password = resetPassword.value.trim();
            const confirmPassword = resetConfirmPassword.value.trim();

            if (!token) {
                setResetFeedback('Kode reset wajib diisi.', 'error');
                resetToken.focus();
                return;
            }
            if (!/^\d{6}$/.test(token)) {
                setResetFeedback('Kode reset harus 6 digit angka.', 'error');
                resetToken.focus();
                return;
            }

            const submitButton = resetForm.querySelector('.login-submit');
            submitButton.disabled = true;
            submitButton.setAttribute('aria-busy', 'true');

            try {
                let response;
                if (!codeVerified) {
                    response = await fetch(`${API_BASE}/api/auth/reset-password/verify`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token })
                    });
                } else {
                    if (password.length < 6) {
                        setResetFeedback('Password baru minimal 6 karakter.', 'error');
                        resetPassword.focus();
                        return;
                    }
                    if (password !== confirmPassword) {
                        setResetFeedback('Konfirmasi password belum sama.', 'error');
                        resetConfirmPassword.focus();
                        return;
                    }
                    response = await fetch(`${API_BASE}/api/auth/reset-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            token: verifiedToken,
                            new_password: password
                        })
                    });
                }

                const rawBody = await response.text();
                let data = {};
                try {
                    data = rawBody ? JSON.parse(rawBody) : {};
                } catch (parseError) {
                    data = {};
                }

                if (!response.ok) {
                    setResetFeedback(data.detail || `Proses reset gagal (HTTP ${response.status}).`, 'error');
                    return;
                }

                if (!codeVerified) {
                    openPasswordStep(token);
                    return;
                }
                setResetFeedback('Password berhasil diperbarui. Mengarahkan ke halaman masuk...', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1200);
            } catch (error) {
                setResetFeedback('Tidak bisa terhubung ke backend.', 'error');
            } finally {
                submitButton.disabled = false;
                submitButton.removeAttribute('aria-busy');
            }
        });
    </script>
</body>

</html>

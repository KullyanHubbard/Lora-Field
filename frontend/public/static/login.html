<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Login LoraField untuk akses dashboard monitoring kebun berbasis LoRa.">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <script>
        try {
            document.documentElement.dataset.theme = localStorage.getItem('lf_theme') === 'light' ? 'light' : 'dark';
        } catch (error) {
            document.documentElement.dataset.theme = 'dark';
        }
    </script>
    <title>Login - LoraField</title>
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/premium.css">
</head>

<body class="auth-page">
    <header class="auth-brand-bar" aria-label="LoraField branding">
        <div class="auth-brand-link">
            <span class="auth-brand-name">LoraField</span>
        </div>
        <div class="auth-theme-slot" aria-label="Pengaturan tema"></div>
    </header>
    <main class="login-shell" aria-labelledby="login-title">
        <section class="login-card login-card-center" aria-label="Form login">
            <div class="login-intro">
                <h1 id="login-title">Masuk Akun</h1>
                <p>Monitoring kebun LoRa dalam satu akses.</p>
            </div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="login-email">Email atau Username</label>
                    <input class="form-control" type="text" id="login-email" name="email" autocomplete="username"
                        placeholder="nama@email.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input class="form-control" type="password" id="login-password" name="password"
                        autocomplete="current-password" placeholder="Masukkan password" required>
                </div>
                <button class="btn btn-primary login-submit" type="submit">
                    <svg class="login-submit-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                        <path d="M10 17l5-5-5-5" />
                        <path d="M15 12H3" />
                    </svg>
                    <span>Masuk</span>
                </button>

                <button class="forgot-link" id="forgot-password" type="button" aria-expanded="false"
                    aria-controls="forgot-panel">
                    Lupa Password?
                </button>
                <section class="forgot-panel" id="forgot-panel" aria-label="Atur ulang password" hidden>
                    <div class="form-group">
                        <label for="forgot-email">Email Akun</label>
                        <input class="form-control" type="email" id="forgot-email" autocomplete="email"
                            placeholder="nama@email.com">
                    </div>
                    <div class="form-group" id="forgot-code-row" hidden>
                        <label for="forgot-code">Kode Verifikasi</label>
                        <input class="form-control" type="text" id="forgot-code" inputmode="numeric"
                            autocomplete="one-time-code" placeholder="Masukkan 6 digit kode">
                    </div>
                    <div class="form-group forgot-reset-field" hidden>
                        <label for="forgot-new-password">Password Baru</label>
                        <input class="form-control" type="password" id="forgot-new-password" autocomplete="new-password"
                            placeholder="Minimal 6 karakter">
                    </div>
                    <div class="form-group forgot-reset-field" hidden>
                        <label for="forgot-confirm-password">Ulangi Password</label>
                        <input class="form-control" type="password" id="forgot-confirm-password"
                            autocomplete="new-password" placeholder="Ulangi password baru">
                    </div>
                    <button class="btn btn-secondary forgot-submit" id="forgot-submit" type="button">
                        Kirim Kode
                    </button>
                    <p class="forgot-feedback" id="forgot-feedback" role="status" aria-live="polite" hidden></p>
                </section>

                <div class="auth-divider" aria-hidden="true"><span>atau</span></div>

                <p class="auth-switch">
                    Belum punya akun?
                    <button class="auth-switch-link" id="register-toggle" type="button" aria-expanded="false"
                        aria-controls="register-panel">Daftar Akun</button>
                </p>
                <section class="forgot-panel" id="register-panel" aria-label="Daftar akun baru" hidden>
                    <div class="form-group">
                        <label for="register-name">Nama Lengkap</label>
                        <input class="form-control" type="text" id="register-name" autocomplete="name"
                            placeholder="Nama lengkap kamu">
                    </div>
                    <div class="form-group">
                        <label for="register-email">Email</label>
                        <input class="form-control" type="email" id="register-email" autocomplete="email"
                            placeholder="nama@email.com">
                    </div>
                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <input class="form-control" type="password" id="register-password" autocomplete="new-password"
                            placeholder="Minimal 6 karakter">
                    </div>
                    <div class="form-group">
                        <label for="register-confirm">Ulangi Password</label>
                        <input class="form-control" type="password" id="register-confirm" autocomplete="new-password"
                            placeholder="Ulangi password">
                    </div>
                    <button class="btn btn-primary forgot-submit" id="register-submit" type="button">
                        Buat Akun
                    </button>
                    <p class="forgot-feedback" id="register-feedback" role="status" aria-live="polite" hidden></p>
                </section>
            </form>
        </section>
    </main>

    <script src="js/main.js"></script>
    <script>
        const loginEmail = document.getElementById('login-email');
        const loginPassword = document.getElementById('login-password');
        const forgotButton = document.getElementById('forgot-password');
        const forgotPanel = document.getElementById('forgot-panel');
        const forgotEmail = document.getElementById('forgot-email');
        const forgotCodeRow = document.getElementById('forgot-code-row');
        const forgotCodeInput = document.getElementById('forgot-code');
        const forgotNewPassword = document.getElementById('forgot-new-password');
        const forgotConfirmPassword = document.getElementById('forgot-confirm-password');
        const forgotSubmit = document.getElementById('forgot-submit');
        const forgotFeedback = document.getElementById('forgot-feedback');
        const forgotResetFields = document.querySelectorAll('.forgot-reset-field');
        let forgotCode = '';

        document.getElementById('login-form').addEventListener('submit', event => {
            event.preventDefault();
            try {
                localStorage.setItem('lf_auth_demo', 'true');
                localStorage.removeItem('lf_selected_farm');
            } catch (error) {
                // Login demo tetap lanjut tanpa penyimpanan lokal.
            }
            window.location.href = 'index.html';
        });

        function setForgotFeedback(message, type) {
            forgotFeedback.hidden = false;
            forgotFeedback.className = `forgot-feedback forgot-feedback-${type}`;
            forgotFeedback.textContent = message;
        }

        function resetForgotState() {
            forgotCode = '';
            forgotCodeRow.hidden = true;
            forgotCodeInput.value = '';
            forgotNewPassword.value = '';
            forgotConfirmPassword.value = '';
            forgotResetFields.forEach(field => {
                field.hidden = true;
            });
            forgotSubmit.textContent = 'Kirim Kode';
            forgotFeedback.hidden = true;
            forgotFeedback.textContent = '';
        }

        const registerToggle = document.getElementById('register-toggle');
        const registerPanel = document.getElementById('register-panel');
        const registerName = document.getElementById('register-name');
        const registerEmail = document.getElementById('register-email');
        const registerPassword = document.getElementById('register-password');
        const registerConfirm = document.getElementById('register-confirm');
        const registerSubmit = document.getElementById('register-submit');
        const registerFeedback = document.getElementById('register-feedback');

        function closeRegisterPanel() {
            registerPanel.hidden = true;
            registerToggle.setAttribute('aria-expanded', 'false');
        }

        function closeForgotPanel() {
            forgotPanel.hidden = true;
            forgotButton.setAttribute('aria-expanded', 'false');
        }

        forgotButton.addEventListener('click', () => {
            const isOpening = forgotPanel.hidden;
            if (isOpening) closeRegisterPanel();
            forgotPanel.hidden = !isOpening;
            forgotButton.setAttribute('aria-expanded', String(isOpening));

            if (!isOpening) return;

            forgotEmail.value = loginEmail.value.trim();
            resetForgotState();
            forgotEmail.focus();
        });

        function setRegisterFeedback(message, type) {
            registerFeedback.hidden = false;
            registerFeedback.className = `forgot-feedback forgot-feedback-${type}`;
            registerFeedback.textContent = message;
        }

        function resetRegisterState() {
            registerName.value = '';
            registerEmail.value = '';
            registerPassword.value = '';
            registerConfirm.value = '';
            registerFeedback.hidden = true;
            registerFeedback.textContent = '';
        }

        registerToggle.addEventListener('click', () => {
            const isOpening = registerPanel.hidden;
            if (isOpening) closeForgotPanel();
            registerPanel.hidden = !isOpening;
            registerToggle.setAttribute('aria-expanded', String(isOpening));

            if (!isOpening) return;

            resetRegisterState();
            registerName.focus();
        });

        registerSubmit.addEventListener('click', () => {
            const name = registerName.value.trim();
            const email = registerEmail.value.trim();
            const password = registerPassword.value.trim();
            const confirm = registerConfirm.value.trim();

            if (!name) {
                setRegisterFeedback('Nama lengkap wajib diisi.', 'error');
                registerName.focus();
                return;
            }
            if (!email || !email.includes('@')) {
                setRegisterFeedback('Email belum valid.', 'error');
                registerEmail.focus();
                return;
            }
            if (password.length < 6) {
                setRegisterFeedback('Password minimal 6 karakter.', 'error');
                registerPassword.focus();
                return;
            }
            if (password !== confirm) {
                setRegisterFeedback('Ulangi password belum sama.', 'error');
                registerConfirm.focus();
                return;
            }

            loginEmail.value = email;
            loginPassword.value = password;
            setRegisterFeedback('Akun berhasil dibuat. Silakan masuk dengan akun baru kamu.', 'success');
        });

        forgotSubmit.addEventListener('click', () => {
            const identifier = forgotEmail.value.trim() || loginEmail.value.trim();
            const submittedCode = forgotCodeInput.value.trim();
            const nextPassword = forgotNewPassword.value.trim();
            const confirmPassword = forgotConfirmPassword.value.trim();
            if (!identifier) {
                setForgotFeedback('Masukkan email akun terlebih dahulu.', 'error');
                forgotEmail.focus();
                return;
            }

            if (!forgotCode) {
                forgotCode = String(Math.floor(100000 + Math.random() * 900000));
                forgotCodeRow.hidden = false;
                forgotResetFields.forEach(field => {
                    field.hidden = false;
                });
                forgotSubmit.textContent = 'Simpan Password';
                setForgotFeedback(`Kode verifikasi untuk ${identifier}: ${forgotCode}`, 'success');
                forgotCodeInput.focus();
                return;
            }

            if (submittedCode !== forgotCode) {
                setForgotFeedback('Kode verifikasi belum sesuai.', 'error');
                forgotCodeInput.focus();
                return;
            }

            if (nextPassword.length < 6) {
                setForgotFeedback('Password baru minimal 6 karakter.', 'error');
                forgotNewPassword.focus();
                return;
            }

            if (nextPassword !== confirmPassword) {
                setForgotFeedback('Ulangi password belum sama.', 'error');
                forgotConfirmPassword.focus();
                return;
            }

            loginEmail.value = identifier;
            loginPassword.value = nextPassword;
            setForgotFeedback('Password berhasil disimpan untuk sesi demo. Silakan masuk dengan password baru.', 'success');
        });
    </script>
</body>

</html>

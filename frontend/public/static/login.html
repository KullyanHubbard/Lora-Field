<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Login LoraField untuk akses dashboard monitoring kebun berbasis LoRa.">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <script>
        try {
            document.documentElement.dataset.theme = localStorage.getItem('lf_theme') === 'light' ? 'light' : 'dark';
        } catch (error) {
            document.documentElement.dataset.theme = 'dark';
        }
    </script>
    <title>Login - LoraField</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f9f6e'/%3E%3Cpath d='M18 39c14-1 22-8 28-22 1 17-7 29-24 31-4-2-6-5-4-9z' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/premium.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </noscript>
</head>

<body class="auth-page">
    <main class="login-shell">
        <section class="login-brand-panel" aria-label="LoraField">
            <div class="login-logo">
                <i class="fas fa-seedling" aria-hidden="true"></i>
                <span>LoraField</span>
            </div>
            <h1>Akses aman dashboard LoraField</h1>
            <div class="login-info-grid">
                <div>
                    <span>Akun</span>
                    <strong>User</strong>
                </div>
                <div>
                    <span>Autentikasi</span>
                    <strong>Password</strong>
                </div>
                <div>
                    <span>Akses</span>
                    <strong>Terbatas</strong>
                </div>
            </div>
        </section>

        <section class="login-card" aria-label="Form login">
            <div class="card-header">
                <div>
                    <h2>Masuk Akun</h2>
                    <span class="card-subtitle">Akses dashboard sesuai kebun milik user.</span>
                </div>
            </div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="login-email">Email atau Username</label>
                    <input class="form-control" type="text" id="login-email" name="email" autocomplete="username"
                        value="pak.budi@lorafield.local" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input class="form-control" type="password" id="login-password" name="password"
                        autocomplete="current-password" value="password" required>
                </div>
                <button class="btn btn-primary login-submit" type="submit">
                    <i class="fas fa-right-to-bracket" aria-hidden="true"></i> Login
                </button>
                <a class="forgot-link" href="#">Lupa Password</a>
            </form>
        </section>
    </main>

    <script>
        document.getElementById('login-form').addEventListener('submit', event => {
            event.preventDefault();
            try {
                localStorage.setItem('lf_auth_demo', 'true');
            } catch (error) {
                // Login demo tetap lanjut tanpa penyimpanan lokal.
            }
            window.location.href = 'index.html';
        });
    </script>
</body>

</html>

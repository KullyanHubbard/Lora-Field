<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Login LoraField untuk akses dashboard monitoring kebun berbasis LoRa.">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <script>
        try {
            document.documentElement.dataset.theme = localStorage.getItem('lf_theme') === 'light' ? 'light' : 'dark';
        } catch (error) {
            document.documentElement.dataset.theme = 'dark';
        }
    </script>
    <title>Login - LoraField</title>
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/premium.css">
</head>

<body class="auth-page">
    <header class="auth-brand-bar" aria-label="LoraField branding">
        <div class="auth-brand-link">
            <span class="auth-brand-name">LoraField</span>
        </div>
        <div class="auth-theme-slot" aria-label="Pengaturan tema"></div>
    </header>
    <main class="login-shell" aria-labelledby="login-title">
        <section class="login-card login-card-center" aria-label="Form login">
            <div class="login-intro">
                <h1 id="login-title">Masuk Akun</h1>
                <p>Monitoring kebun LoRa dalam satu akses.</p>
            </div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="login-email">Email atau Username</label>
                    <input class="form-control" type="text" id="login-email" name="email" autocomplete="username"
                        placeholder="nama@email.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="password-field">
                        <input class="form-control password-input" type="password" id="login-password" name="password"
                            autocomplete="current-password" placeholder="Masukkan password" required>
                        <button class="password-toggle" type="button" data-target="login-password"
                            aria-label="Tampilkan password" aria-pressed="false">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <g class="icon-eye-open">
                                    <path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7-10-7-10-7Z" />
                                    <circle cx="12" cy="12" r="3.2" />
                                </g>
                                <g class="icon-eye-closed password-icon-state-hidden">
                                    <path d="M3 3l18 18" />
                                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                                    <path d="M9.9 5.2A10.6 10.6 0 0 1 12 5c6.2 0 10 7 10 7a17.3 17.3 0 0 1-3.2 4.2" />
                                    <path d="M6.3 6.3A17 17 0 0 0 2 12s3.8 7 10 7c1.3 0 2.4-.2 3.5-.6" />
                                </g>
                            </svg>
                        </button>
                    </div>
                </div>
                <button class="btn btn-primary login-submit" type="submit">
                    <svg class="login-submit-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                        <path d="M10 17l5-5-5-5" />
                        <path d="M15 12H3" />
                    </svg>
                    <span>Masuk</span>
                </button>

                <button class="forgot-link" id="forgot-password" type="button" aria-expanded="false"
                    aria-controls="forgot-panel">
                    Lupa Password?
                </button>
                <section class="forgot-panel" id="forgot-panel" aria-label="Atur ulang password" hidden>
                    <div class="form-group">
                        <label for="forgot-email">Email Akun</label>
                        <input class="form-control" type="email" id="forgot-email" autocomplete="email"
                            placeholder="nama@email.com">
                    </div>
                    <div class="form-group" id="forgot-code-row" hidden>
                        <label for="forgot-code">Kode Reset (6 Digit)</label>
                        <input class="form-control" type="text" id="forgot-code" inputmode="numeric"
                            autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"
                            placeholder="Masukkan kode 6 digit dari email">
                    </div>
                    <div class="form-group forgot-reset-field" hidden>
                        <label for="forgot-new-password">Password Baru</label>
                        <input class="form-control" type="password" id="forgot-new-password" autocomplete="new-password"
                            placeholder="Minimal 6 karakter">
                    </div>
                    <div class="form-group forgot-reset-field" hidden>
                        <label for="forgot-confirm-password">Ulangi Password</label>
                        <input class="form-control" type="password" id="forgot-confirm-password"
                            autocomplete="new-password" placeholder="Ulangi password baru">
                    </div>
                    <button class="btn btn-secondary forgot-submit" id="forgot-submit" type="button">
                        Kirim Link Reset
                    </button>
                    <p class="forgot-feedback" id="forgot-feedback" role="status" aria-live="polite" hidden></p>
                </section>

                <div class="auth-divider" aria-hidden="true"><span>atau</span></div>

                <p class="auth-switch">
                    Belum punya akun?
                    <a class="auth-switch-link" href="register.html">Daftar Akun</a>
                </p>
            </form>
        </section>
    </main>

    <script src="js/main.js"></script>
    <script>
        const API_BASE = (() => {
            const manualBase = localStorage.getItem('lf_api_base');
            if (manualBase) return manualBase;
            if (window.location.port === '8000') return window.location.origin;
            return 'http://localhost:8000';
        })();
        const loginEmail = document.getElementById('login-email');
        const loginPassword = document.getElementById('login-password');
        const loginForm = document.getElementById('login-form');
        const forgotButton = document.getElementById('forgot-password');
        const forgotPanel = document.getElementById('forgot-panel');
        const forgotEmail = document.getElementById('forgot-email');
        const forgotCodeRow = document.getElementById('forgot-code-row');
        const forgotCodeInput = document.getElementById('forgot-code');
        const forgotNewPassword = document.getElementById('forgot-new-password');
        const forgotConfirmPassword = document.getElementById('forgot-confirm-password');
        const forgotSubmit = document.getElementById('forgot-submit');
        const forgotFeedback = document.getElementById('forgot-feedback');
        const forgotResetFields = document.querySelectorAll('.forgot-reset-field');
        const passwordToggles = document.querySelectorAll('.password-toggle');
        let forgotResetStep = false;

        try {
            const prefillEmail = sessionStorage.getItem('lf_prefill_email');
            if (prefillEmail) {
                loginEmail.value = prefillEmail;
                sessionStorage.removeItem('lf_prefill_email');
            }
        } catch (error) {
            // Abaikan jika sessionStorage tidak tersedia.
        }

        passwordToggles.forEach(toggle => {
            toggle.addEventListener('click', () => {
                const targetId = toggle.getAttribute('data-target');
                const input = document.getElementById(targetId);
                if (!input) return;
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                toggle.setAttribute('aria-pressed', String(show));
                toggle.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
                const openIcon = toggle.querySelector('.icon-eye-open');
                const closedIcon = toggle.querySelector('.icon-eye-closed');
                if (openIcon) openIcon.classList.toggle('password-icon-state-hidden', show);
                if (closedIcon) closedIcon.classList.toggle('password-icon-state-hidden', !show);
            });
        });

        loginForm.addEventListener('submit', async event => {
            event.preventDefault();
            const email = loginEmail.value.trim();
            const password = loginPassword.value.trim();

            if (!email || !password) {
                setForgotFeedback('Email dan password wajib diisi.', 'error');
                return;
            }

            const submitButton = loginForm.querySelector('.login-submit');
            submitButton.disabled = true;
            submitButton.setAttribute('aria-busy', 'true');

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const rawBody = await response.text();
                let data = {};
                try {
                    data = rawBody ? JSON.parse(rawBody) : {};
                } catch (parseError) {
                    data = {};
                }

                if (!response.ok) {
                    const detail = response.status === 401
                        ? 'Username atau password salah.'
                        : (data.detail || `Login gagal (HTTP ${response.status}).`);
                    setForgotFeedback(detail, 'error');
                    return;
                }

                localStorage.setItem('lf_auth_demo', 'true');
                localStorage.removeItem('lf_selected_farm');
                localStorage.setItem('lf_access_token', data.access_token || '');
                localStorage.setItem('lf_token_type', data.token_type || 'bearer');
                localStorage.setItem('lf_user', JSON.stringify(data.user || {}));
                setForgotFeedback('Login berhasil. Mengarahkan ke dashboard...', 'success');
            } catch (error) {
                setForgotFeedback('Tidak bisa terhubung ke backend.', 'error');
                return;
            } finally {
                submitButton.disabled = false;
                submitButton.removeAttribute('aria-busy');
            }

            window.location.href = 'index.html';
        });

        function setForgotFeedback(message, type) {
            forgotFeedback.hidden = false;
            forgotFeedback.className = `forgot-feedback forgot-feedback-${type}`;
            forgotFeedback.textContent = message;
        }

        function resetForgotState() {
            forgotResetStep = false;
            forgotCodeRow.hidden = true;
            forgotCodeInput.value = '';
            forgotNewPassword.value = '';
            forgotConfirmPassword.value = '';
            forgotResetFields.forEach(field => {
                field.hidden = true;
            });
            forgotSubmit.textContent = 'Kirim Link Reset';
            forgotFeedback.hidden = true;
            forgotFeedback.textContent = '';
        }

        forgotButton.addEventListener('click', () => {
            const isOpening = forgotPanel.hidden;
            forgotPanel.hidden = !isOpening;
            forgotButton.setAttribute('aria-expanded', String(isOpening));

            if (!isOpening) return;

            forgotEmail.value = loginEmail.value.trim();
            resetForgotState();
            forgotEmail.focus();
        });

        forgotSubmit.addEventListener('click', async () => {
            const identifier = forgotEmail.value.trim() || loginEmail.value.trim();
            const submittedToken = forgotCodeInput.value.trim();
            const nextPassword = forgotNewPassword.value.trim();
            const confirmPassword = forgotConfirmPassword.value.trim();
            if (!identifier) {
                setForgotFeedback('Masukkan email akun terlebih dahulu.', 'error');
                forgotEmail.focus();
                return;
            }

            if (!forgotResetStep) {
                forgotSubmit.disabled = true;
                forgotSubmit.setAttribute('aria-busy', 'true');
                try {
                    const response = await fetch(`${API_BASE}/api/auth/forgot-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: identifier })
                    });
                    const rawBody = await response.text();
                    let data = {};
                    try {
                        data = rawBody ? JSON.parse(rawBody) : {};
                    } catch (parseError) {
                        data = {};
                    }
                    if (!response.ok) {
                        setForgotFeedback(data.detail || `Gagal kirim reset (HTTP ${response.status}).`, 'error');
                        return;
                    }
                    forgotResetStep = true;
                    forgotCodeRow.hidden = false;
                    forgotResetFields.forEach(field => {
                        field.hidden = false;
                    });
                    forgotSubmit.textContent = 'Perbarui Password';
                    setForgotFeedback(
                        data.note
                            ? 'Kode reset tersedia untuk pengujian. Lanjutkan dengan mengisi password baru.'
                            : 'Link reset telah dikirim ke email. Masukkan kode reset lalu perbarui password Anda.',
                        'success'
                    );
                    forgotCodeInput.focus();
                } catch (error) {
                    setForgotFeedback('Tidak bisa terhubung ke backend.', 'error');
                } finally {
                    forgotSubmit.disabled = false;
                    forgotSubmit.removeAttribute('aria-busy');
                }
                return;
            }

            if (!submittedToken) {
                setForgotFeedback('Masukkan kode reset password.', 'error');
                forgotCodeInput.focus();
                return;
            }
            if (!/^\d{6}$/.test(submittedToken)) {
                setForgotFeedback('Kode reset harus 6 digit angka.', 'error');
                forgotCodeInput.focus();
                return;
            }

            if (nextPassword.length < 6) {
                setForgotFeedback('Password baru minimal 6 karakter.', 'error');
                forgotNewPassword.focus();
                return;
            }

            if (nextPassword !== confirmPassword) {
                setForgotFeedback('Ulangi password belum sama.', 'error');
                forgotConfirmPassword.focus();
                return;
            }

            forgotSubmit.disabled = true;
            forgotSubmit.setAttribute('aria-busy', 'true');
            try {
                const response = await fetch(`${API_BASE}/api/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: submittedToken, new_password: nextPassword })
                });
                const rawBody = await response.text();
                let data = {};
                try {
                    data = rawBody ? JSON.parse(rawBody) : {};
                } catch (parseError) {
                    data = {};
                }
                if (!response.ok) {
                    setForgotFeedback(data.detail || `Reset password gagal (HTTP ${response.status}).`, 'error');
                    return;
                }
                setForgotFeedback(data.message || 'Password berhasil diperbarui. Silakan login.', 'success');
            } catch (error) {
                setForgotFeedback('Tidak bisa terhubung ke backend.', 'error');
            } finally {
                forgotSubmit.disabled = false;
                forgotSubmit.removeAttribute('aria-busy');
            }
        });
    </script>
</body>

</html>

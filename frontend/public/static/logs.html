<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="LoraField - Log keputusan sistem irigasi otomatis.">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LoraField">
    <script>
        try {
            document.documentElement.dataset.theme = localStorage.getItem('lf_theme') === 'light' ? 'light' : 'dark';
        } catch (error) {
            document.documentElement.dataset.theme = 'dark';
        }
    </script>
    <title>Log Sistem - LoraField</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f9f6e'/%3E%3Cpath d='M18 39c14-1 22-8 28-22 1 17-7 29-24 31-4-2-6-5-4-9z' fill='white'/%3E%3C/svg%3E">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/premium.css">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
        media="print" onload="this.media='all'">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
        media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap">
    </noscript>
</head>
<body>
    <!-- Ambient Background -->
    <div class="ambient-bg">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="ambient-orb orb-3"></div>
    </div>
    <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
        <div class="sidebar-brand">
            <h2><i class="fas fa-seedling" aria-hidden="true"></i> LoraField</h2>
            <p>LoRa-Based Precision Agriculture System</p>
        </div>
        <nav class="sidebar-nav" aria-label="Menu aplikasi"></nav>
        <div class="sidebar-footer">LoraField v1.5 Beta &middot; CDP 2026</div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-toggle" id="sidebar-toggle" type="button" aria-label="Buka navigasi" aria-controls="sidebar">
                    <i class="fas fa-bars" aria-hidden="true"></i>
                </button>
            </div>
            <div class="topbar-right">
                <span class="topbar-clock" id="realtime-clock"></span>
            </div>
        </header>

        <div class="page-content">
            <div class="card mb-24">
                <div class="log-tools">
                    <div class="filter-bar" id="log-filters" role="group" aria-label="Filter log">
                        <button class="filter-btn active" type="button" data-filter="all" aria-pressed="true">Semua Log</button>
                        <button class="filter-btn" type="button" data-filter="open" aria-pressed="false">Irigasi Dijalankan</button>
                        <button class="filter-btn" type="button" data-filter="delayed" aria-pressed="false">Irigasi Ditunda</button>
                        <button class="filter-btn" type="button" data-filter="closed" aria-pressed="false">Valve Tertutup</button>
                        <button class="filter-btn" type="button" data-filter="warning" aria-pressed="false">Peringatan</button>
                    </div>
                    <div class="log-right">
                        <label class="search-box" for="log-search">
                            <i class="fas fa-search" aria-hidden="true"></i>
                            <input type="text" placeholder="Cari node, lokasi, atau keputusan..." id="log-search">
                        </label>
                        <button class="btn btn-secondary" type="button" id="btn-export-csv">
                            <i class="fas fa-download" aria-hidden="true"></i> Ekspor CSV
                        </button>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Waktu</th>
                                <th>Node</th>
                                <th>Lokasi</th>
                                <th>Kelembapan</th>
                                <th>Threshold</th>
                                <th>Suhu Tanah</th>
                                <th>Cuaca</th>
                                <th>Keputusan</th>
                                <th>Valve</th>
                                <th>Keterangan</th>
                            </tr>
                        </thead>
                        <tbody id="log-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="js/dummy-data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/simulation.js"></script>
    <script>
        let activeFilter = 'all';
        let searchQuery = '';

        function mapApiLog(apiLog) {
            const dt = new Date(apiLog.created_at);
            const time = isNaN(dt) ? apiLog.created_at : dt.toLocaleTimeString('id-ID', {
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
            let type = 'normal';
            if (apiLog.valve_state === 'open') type = 'open';
            else if (apiLog.decision && apiLog.decision.toLowerCase().includes('ditunda')) type = 'delayed';
            else if (apiLog.valve_state === 'closed' && apiLog.decision && apiLog.decision.toLowerCase().includes('berhenti')) type = 'closed';
            return {
                time,
                node: apiLog.node_id,
                location: apiLog.node_id,
                soilMoisture: apiLog.soil_moisture,
                threshold: `${ThresholdManager.lower}%-${ThresholdManager.upper}%`,
                soilTemp: '—',
                weather: apiLog.weather || '—',
                weatherCode: '-',
                decision: apiLog.decision,
                valve: apiLog.valve_state === 'open' ? 'Terbuka' : 'Tertutup',
                type,
                note: apiLog.reason || '—'
            };
        }

        function getScopedLogs() {
            const farm = getCurrentFarm();
            const farmNodeIds = new Set(farm ? (farm.nodeIds || []) : []);
            const farmNodeNames = new Set(getFarmNodes(farm).map(node => node.name));
            return DECISION_LOGS.filter(log =>
                farmNodeIds.has(log.node) || farmNodeNames.has(log.node)
            );
        }

        function renderLogs() {
            let logs = getScopedLogs();
            if (activeFilter !== 'all') logs = logs.filter(log => log.type === activeFilter);
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                logs = logs.filter(log =>
                    log.node.toLowerCase().includes(query) ||
                    log.decision.toLowerCase().includes(query) ||
                    log.location.toLowerCase().includes(query)
                );
            }

            const tbody = document.getElementById('log-table-body');
            if (!logs.length) {
                tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted">Tidak ada log yang cocok dengan filter.</td></tr>';
                return;
            }

            tbody.innerHTML = logs.map(log => {
                const badge = getDecisionBadge(log.type);
                return `<tr>
                    <td class="data-value">${escapeHtml(log.time)}</td>
                    <td>${escapeHtml(log.node)}</td>
                    <td>${escapeHtml(log.location)}</td>
                    <td class="data-value">${log.soilMoisture}%</td>
                    <td class="data-value">${escapeHtml(log.threshold)}</td>
                    <td class="data-value">${log.soilTemp}${DEG_C}</td>
                    <td>${escapeHtml(log.weather)}</td>
                    <td><span class="badge ${badge.className}">${escapeHtml(log.decision)}</span></td>
                    <td>${escapeHtml(log.valve)}</td>
                    <td class="text-sm text-muted">${escapeHtml(log.note)}</td>
                </tr>`;
            }).join('');
        }

        document.getElementById('log-filters').addEventListener('click', event => {
            if (!event.target.classList.contains('filter-btn')) return;

            document.querySelectorAll('#log-filters .filter-btn').forEach(button => {
                button.classList.remove('active');
                button.setAttribute('aria-pressed', 'false');
            });
            event.target.classList.add('active');
            event.target.setAttribute('aria-pressed', 'true');
            activeFilter = event.target.dataset.filter;
            renderLogs();
        });

        document.getElementById('log-search').addEventListener('input', event => {
            searchQuery = event.target.value.trim();
            renderLogs();
        });

        function escapeCSV(value) {
            const str = String(value ?? '');
            if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
                return '"' + str.replace(/"/g, '""') + '"';
            }
            return str;
        }

        function exportLogsCSV() {
            let logs = getScopedLogs();
            if (activeFilter !== 'all') logs = logs.filter(log => log.type === activeFilter);
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                logs = logs.filter(log =>
                    log.node.toLowerCase().includes(query) ||
                    log.decision.toLowerCase().includes(query) ||
                    log.location.toLowerCase().includes(query)
                );
            }

            const headers = ['Waktu', 'Node', 'Lokasi', 'Kelembapan (%)', 'Threshold', 'Suhu Tanah (°C)', 'Cuaca', 'Keputusan', 'Valve', 'Keterangan'];
            const rows = logs.map(log => [
                log.time,
                log.node,
                log.location,
                log.soilMoisture,
                log.threshold,
                log.soilTemp,
                log.weather,
                log.decision,
                log.valve,
                log.note
            ].map(escapeCSV).join(','));

            const csv = [headers.map(escapeCSV).join(','), ...rows].join('\r\n');
            const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const today = new Date().toISOString().slice(0, 10);
            const a = document.createElement('a');
            a.href = url;
            a.download = `lorafield-logs-${today}.csv`;
            a.className = 'download-link-hidden';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const farmId = urlParams.get('farm');

            await loadFarmsFromAPI(CURRENT_USER_ID);
            if (farmId) await loadFarmSummaryFromAPI(farmId);

            try {
                const logsRes = await fetch(`${API_BASE}/api/logs?limit=50`);
                if (logsRes.ok) {
                    const logsData = await logsRes.json();
                    DECISION_LOGS.length = 0;
                    (logsData.items || []).map(mapApiLog).forEach(l => DECISION_LOGS.push(l));
                }
            } catch (err) {
                console.warn('[LoraField] Gagal load logs dari API, pakai data lokal:', err.message);
            }

            const oldSwitcher = document.getElementById('farm-switcher');
            if (oldSwitcher) oldSwitcher.remove();
            renderFarmSwitcher();
            renderContextSidebar();
            setActivePage();

            document.getElementById('btn-export-csv').addEventListener('click', exportLogsCSV);
            renderLogs();
            startSimulation();
        });
    </script>
</body>
</html>

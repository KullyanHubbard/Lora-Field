<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LoraField - Log keputusan sistem irigasi otomatis.">
    <script>
        try {
            document.documentElement.dataset.theme = localStorage.getItem('lf_theme') === 'light' ? 'light' : 'dark';
        } catch (error) {
            document.documentElement.dataset.theme = 'dark';
        }
    </script>
    <title>Log Sistem - LoraField</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f9f6e'/%3E%3Cpath d='M18 39c14-1 22-8 28-22 1 17-7 29-24 31-4-2-6-5-4-9z' fill='white'/%3E%3C/svg%3E">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/premium.css">
</head>
<body>
    <!-- Ambient Background -->
    <div class="ambient-bg">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="ambient-orb orb-3"></div>
    </div>
    <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
        <div class="sidebar-brand">
            <h2><i class="fas fa-seedling" aria-hidden="true"></i> LoraField</h2>
            <p>LoRa-Based Precision Agriculture System</p>
        </div>
        <nav class="sidebar-nav" aria-label="Menu aplikasi">
            <a href="index.html" class="sidebar-link"><i class="fas fa-th-large" aria-hidden="true"></i> Dashboard</a>
            <a href="monitoring.html" class="sidebar-link"><i class="fas fa-chart-area" aria-hidden="true"></i> Monitoring</a>
            <a href="irrigation.html" class="sidebar-link"><i class="fas fa-tint" aria-hidden="true"></i> Irrigation</a>
            <a href="weather.html" class="sidebar-link"><i class="fas fa-cloud-sun" aria-hidden="true"></i> Weather</a>
            <a href="logs.html" class="sidebar-link active" aria-current="page"><i class="fas fa-list-alt" aria-hidden="true"></i> System Logs</a>
        </nav>
        <div class="sidebar-footer">LoraField v0.1-alpha &middot; CDP 2025</div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-toggle" id="sidebar-toggle" type="button" aria-label="Buka navigasi" aria-controls="sidebar">
                    <i class="fas fa-bars" aria-hidden="true"></i>
                </button>
                <span class="topbar-title">
                    <span class="topbar-title-full">System Logs</span>
                    <span class="topbar-title-short">Logs</span>
                </span>
            </div>
            <div class="topbar-right">
                <span class="topbar-clock" id="realtime-clock"></span>
                <span class="badge badge-green badge-online">Online</span>
            </div>
        </header>

        <div class="page-content">
            <section class="page-header">
                <div>
                    <span class="page-kicker">Decision Audit</span>
                </div>
                <div class="page-header-actions">
                    <span class="status-pill"><i class="fas fa-database" aria-hidden="true"></i> 50 log terakhir</span>
                </div>
            </section>

            <div class="card mb-24">
                <div class="log-tools">
                    <div class="filter-bar" id="log-filters" role="group" aria-label="Filter log">
                        <button class="filter-btn active" type="button" data-filter="all" aria-pressed="true">Semua Log</button>
                        <button class="filter-btn" type="button" data-filter="open" aria-pressed="false">Irigasi Dijalankan</button>
                        <button class="filter-btn" type="button" data-filter="delayed" aria-pressed="false">Irigasi Ditunda</button>
                        <button class="filter-btn" type="button" data-filter="closed" aria-pressed="false">Valve Tertutup</button>
                        <button class="filter-btn" type="button" data-filter="warning" aria-pressed="false">Warning</button>
                    </div>
                    <label class="search-box" for="log-search">
                        <i class="fas fa-search" aria-hidden="true"></i>
                        <input type="text" placeholder="Cari node, lokasi, atau keputusan..." id="log-search">
                    </label>
                </div>
            </div>

            <div class="card">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Waktu</th>
                                <th>Node</th>
                                <th>Lokasi</th>
                                <th>Kelembapan</th>
                                <th>Threshold</th>
                                <th>Suhu Tanah</th>
                                <th>Cuaca</th>
                                <th>Code</th>
                                <th>Keputusan</th>
                                <th>Valve</th>
                                <th>Keterangan</th>
                            </tr>
                        </thead>
                        <tbody id="log-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="js/dummy-data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/simulation.js"></script>
    <script>
        let activeFilter = 'all';
        let searchQuery = '';

        function renderLogs() {
            let logs = DECISION_LOGS;
            if (activeFilter !== 'all') logs = logs.filter(log => log.type === activeFilter);
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                logs = logs.filter(log =>
                    log.node.toLowerCase().includes(query) ||
                    log.decision.toLowerCase().includes(query) ||
                    log.location.toLowerCase().includes(query)
                );
            }

            const tbody = document.getElementById('log-table-body');
            if (!logs.length) {
                tbody.innerHTML = '<tr><td colspan="11" class="text-center text-muted">Tidak ada log yang cocok dengan filter.</td></tr>';
                return;
            }

            tbody.innerHTML = logs.map(log => {
                const badge = getDecisionBadge(log.type);
                return `<tr>
                    <td class="data-value">${log.time}</td>
                    <td>${log.node}</td>
                    <td>${log.location}</td>
                    <td class="data-value">${log.soilMoisture}%</td>
                    <td class="data-value">${log.threshold}</td>
                    <td class="data-value">${log.soilTemp}${DEG_C}</td>
                    <td>${log.weather}</td>
                    <td class="data-value">${log.weatherCode}</td>
                    <td><span class="badge ${badge.className}">${log.decision}</span></td>
                    <td>${log.valve}</td>
                    <td class="text-sm text-muted">${log.note}</td>
                </tr>`;
            }).join('');
        }

        document.getElementById('log-filters').addEventListener('click', event => {
            if (!event.target.classList.contains('filter-btn')) return;

            document.querySelectorAll('#log-filters .filter-btn').forEach(button => {
                button.classList.remove('active');
                button.setAttribute('aria-pressed', 'false');
            });
            event.target.classList.add('active');
            event.target.setAttribute('aria-pressed', 'true');
            activeFilter = event.target.dataset.filter;
            renderLogs();
        });

        document.getElementById('log-search').addEventListener('input', event => {
            searchQuery = event.target.value.trim();
            renderLogs();
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderLogs();
            startSimulation();
        });
    </script>
</body>
</html>

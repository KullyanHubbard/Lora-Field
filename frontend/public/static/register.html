<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Daftar akun LoraField untuk akses dashboard monitoring kebun berbasis LoRa.">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <script>
        try {
            document.documentElement.dataset.theme = localStorage.getItem('lf_theme') === 'light' ? 'light' : 'dark';
        } catch (error) {
            document.documentElement.dataset.theme = 'dark';
        }
    </script>
    <title>Daftar Akun - LoraField</title>
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/premium.css">
</head>

<body class="auth-page">
    <header class="auth-brand-bar" aria-label="LoraField branding">
        <div class="auth-brand-link">
            <span class="auth-brand-name">LoraField</span>
        </div>
        <div class="auth-theme-slot" aria-label="Pengaturan tema"></div>
    </header>
    <main class="login-shell" aria-labelledby="register-title">
        <section class="login-card login-card-center" aria-label="Form daftar akun">
            <div class="login-intro">
                <h1 id="register-title">Daftar Akun</h1>
                <p>Buat akun baru untuk akses dashboard LoraField.</p>
            </div>

            <form id="register-form" class="login-form">
                <div class="form-group">
                    <label for="register-name">Nama Lengkap</label>
                    <input class="form-control" type="text" id="register-name" name="name" autocomplete="name"
                        placeholder="Nama lengkap kamu" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input class="form-control" type="email" id="register-email" name="email" autocomplete="email"
                        placeholder="nama@email.com" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <div class="password-field">
                        <input class="form-control password-input" type="password" id="register-password" name="password"
                            autocomplete="new-password" placeholder="Minimal 6 karakter" required>
                        <button class="password-toggle" type="button" data-target="register-password"
                            aria-label="Tampilkan password" aria-pressed="false">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <g class="icon-eye-open">
                                    <path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7-10-7-10-7Z" />
                                    <circle cx="12" cy="12" r="3.2" />
                                </g>
                                <g class="icon-eye-closed password-icon-state-hidden">
                                    <path d="M3 3l18 18" />
                                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                                    <path d="M9.9 5.2A10.6 10.6 0 0 1 12 5c6.2 0 10 7 10 7a17.3 17.3 0 0 1-3.2 4.2" />
                                    <path d="M6.3 6.3A17 17 0 0 0 2 12s3.8 7 10 7c1.3 0 2.4-.2 3.5-.6" />
                                </g>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="register-confirm">Ulangi Password</label>
                    <div class="password-field">
                        <input class="form-control password-input" type="password" id="register-confirm" name="confirm"
                            autocomplete="new-password" placeholder="Ulangi password" required>
                        <button class="password-toggle" type="button" data-target="register-confirm"
                            aria-label="Tampilkan password" aria-pressed="false">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <g class="icon-eye-open">
                                    <path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7-10-7-10-7Z" />
                                    <circle cx="12" cy="12" r="3.2" />
                                </g>
                                <g class="icon-eye-closed password-icon-state-hidden">
                                    <path d="M3 3l18 18" />
                                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                                    <path d="M9.9 5.2A10.6 10.6 0 0 1 12 5c6.2 0 10 7 10 7a17.3 17.3 0 0 1-3.2 4.2" />
                                    <path d="M6.3 6.3A17 17 0 0 0 2 12s3.8 7 10 7c1.3 0 2.4-.2 3.5-.6" />
                                </g>
                            </svg>
                        </button>
                    </div>
                </div>
                <button class="btn btn-primary login-submit" type="submit">
                    <span>Buat Akun</span>
                </button>
                <p class="forgot-feedback" id="register-feedback" role="status" aria-live="polite" hidden></p>

                <div class="auth-divider" aria-hidden="true"><span>atau</span></div>

                <p class="auth-switch">
                    Sudah punya akun?
                    <a class="auth-switch-link" href="login.html">Masuk</a>
                </p>
            </form>
        </section>
    </main>

    <script src="js/main.js"></script>
    <script>
        const API_BASE = (() => {
            const manualBase = localStorage.getItem('lf_api_base');
            if (manualBase) return manualBase;
            if (window.location.port === '8000') return window.location.origin;
            return 'http://localhost:8000';
        })();
        const registerForm = document.getElementById('register-form');
        const registerName = document.getElementById('register-name');
        const registerEmail = document.getElementById('register-email');
        const registerPassword = document.getElementById('register-password');
        const registerConfirm = document.getElementById('register-confirm');
        const registerFeedback = document.getElementById('register-feedback');
        const passwordToggles = document.querySelectorAll('.password-toggle');

        function setRegisterFeedback(message, type) {
            registerFeedback.hidden = false;
            registerFeedback.className = `forgot-feedback forgot-feedback-${type}`;
            registerFeedback.textContent = message;
        }

        passwordToggles.forEach(toggle => {
            toggle.addEventListener('click', () => {
                const targetId = toggle.getAttribute('data-target');
                const input = document.getElementById(targetId);
                if (!input) return;
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                toggle.setAttribute('aria-pressed', String(show));
                toggle.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
                const openIcon = toggle.querySelector('.icon-eye-open');
                const closedIcon = toggle.querySelector('.icon-eye-closed');
                if (openIcon) openIcon.classList.toggle('password-icon-state-hidden', show);
                if (closedIcon) closedIcon.classList.toggle('password-icon-state-hidden', !show);
            });
        });

        registerForm.addEventListener('submit', async event => {
            event.preventDefault();

            const name = registerName.value.trim();
            const email = registerEmail.value.trim();
            const password = registerPassword.value.trim();
            const confirm = registerConfirm.value.trim();

            if (!name) {
                setRegisterFeedback('Nama lengkap wajib diisi.', 'error');
                registerName.focus();
                return;
            }
            if (!email || !email.includes('@')) {
                setRegisterFeedback('Email belum valid.', 'error');
                registerEmail.focus();
                return;
            }
            if (password.length < 6) {
                setRegisterFeedback('Password minimal 6 karakter.', 'error');
                registerPassword.focus();
                return;
            }
            if (password !== confirm) {
                setRegisterFeedback('Ulangi password belum sama.', 'error');
                registerConfirm.focus();
                return;
            }

            const submitButton = registerForm.querySelector('.login-submit');
            submitButton.disabled = true;
            submitButton.setAttribute('aria-busy', 'true');

            try {
                const response = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const rawBody = await response.text();
                let data = {};
                try {
                    data = rawBody ? JSON.parse(rawBody) : {};
                } catch (parseError) {
                    data = {};
                }

                if (!response.ok) {
                    const detail = data.detail || `Gagal membuat akun (HTTP ${response.status}).`;
                    setRegisterFeedback(detail, 'error');
                    return;
                }

                sessionStorage.setItem('lf_prefill_email', email);
                setRegisterFeedback('Akun berhasil dibuat. Mengarahkan ke halaman masuk...', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1200);
            } catch (error) {
                setRegisterFeedback('Tidak bisa terhubung ke backend.', 'error');
            } finally {
                submitButton.disabled = false;
                submitButton.removeAttribute('aria-busy');
            }
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Ganti password akun LoraField.">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <script>
        try {
            document.documentElement.dataset.theme = localStorage.getItem('lf_theme') === 'light' ? 'light' : 'dark';
        } catch (error) {
            document.documentElement.dataset.theme = 'dark';
        }
    </script>
    <title>Ganti Password - LoraField</title>
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/premium.css">
</head>

<body class="auth-page">
    <div class="page-topright" aria-label="Kontrol halaman">
        <div class="auth-theme-slot" aria-label="Pengaturan tema"></div>
        <div class="auth-user-slot"></div>
    </div>
    <main class="login-shell" aria-labelledby="change-pw-title">
        <section class="login-card login-card-center" aria-label="Form ganti password">
            <div class="login-intro">
                <h1 id="change-pw-title">Ganti Password</h1>
                <p>Masukkan password baru untuk akun Anda.</p>
            </div>

            <form id="change-pw-form" class="login-form">
                <div class="form-group">
                    <label for="new-password">Password Baru</label>
                    <div class="password-field">
                        <input class="form-control password-input" type="password" id="new-password"
                            autocomplete="new-password" placeholder="Minimal 6 karakter">
                        <button class="password-toggle" type="button" data-target="new-password"
                            aria-label="Tampilkan password" aria-pressed="false">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <g class="icon-eye-open">
                                    <path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7-10-7-10-7Z" />
                                    <circle cx="12" cy="12" r="3.2" />
                                </g>
                                <g class="icon-eye-closed password-icon-state-hidden">
                                    <path d="M3 3l18 18" />
                                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                                    <path d="M9.9 5.2A10.6 10.6 0 0 1 12 5c6.2 0 10 7 10 7a17.3 17.3 0 0 1-3.2 4.2" />
                                    <path d="M6.3 6.3A17 17 0 0 0 2 12s3.8 7 10 7c1.3 0 2.4-.2 3.5-.6" />
                                </g>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Ulangi Password Baru</label>
                    <div class="password-field">
                        <input class="form-control password-input" type="password" id="confirm-password"
                            autocomplete="new-password" placeholder="Ulangi password baru">
                        <button class="password-toggle" type="button" data-target="confirm-password"
                            aria-label="Tampilkan password" aria-pressed="false">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <g class="icon-eye-open">
                                    <path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7-10-7-10-7Z" />
                                    <circle cx="12" cy="12" r="3.2" />
                                </g>
                                <g class="icon-eye-closed password-icon-state-hidden">
                                    <path d="M3 3l18 18" />
                                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                                    <path d="M9.9 5.2A10.6 10.6 0 0 1 12 5c6.2 0 10 7 10 7a17.3 17.3 0 0 1-3.2 4.2" />
                                    <path d="M6.3 6.3A17 17 0 0 0 2 12s3.8 7 10 7c1.3 0 2.4-.2 3.5-.6" />
                                </g>
                            </svg>
                        </button>
                    </div>
                </div>
                <button class="btn btn-primary login-submit" type="submit">Simpan Password Baru</button>
                <p class="forgot-feedback" id="change-pw-feedback" role="status" aria-live="polite" hidden></p>

                <div class="auth-divider" aria-hidden="true"><span>atau</span></div>

                <p class="auth-switch">
                    Kembali ke
                    <a class="auth-switch-link" href="settings.html">Pengaturan</a>
                </p>
            </form>
        </section>
    </main>

    <script src="js/main.js"></script>
    <script>
        const API_BASE = (() => {
            const manualBase = localStorage.getItem('lf_api_base');
            if (manualBase) return manualBase;
            if (window.location.port === '8000') return window.location.origin;
            const h = window.location.hostname;
            if (h !== 'localhost' && h !== '127.0.0.1') return window.location.origin;
            return 'http://localhost:8000';
        })();

        const token = localStorage.getItem('lf_access_token');
        if (!token) {
            window.location.href = 'login.html';
        }

        const form = document.getElementById('change-pw-form');
        const newPasswordInput = document.getElementById('new-password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        const feedback = document.getElementById('change-pw-feedback');
        const passwordToggles = document.querySelectorAll('.password-toggle');

        function setFeedback(message, type) {
            feedback.hidden = false;
            feedback.className = `forgot-feedback forgot-feedback-${type}`;
            feedback.textContent = message;
        }

        passwordToggles.forEach(toggle => {
            toggle.addEventListener('click', () => {
                const targetId = toggle.getAttribute('data-target');
                const input = document.getElementById(targetId);
                if (!input) return;
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                toggle.setAttribute('aria-pressed', String(show));
                toggle.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
                const openIcon = toggle.querySelector('.icon-eye-open');
                const closedIcon = toggle.querySelector('.icon-eye-closed');
                if (openIcon) openIcon.classList.toggle('password-icon-state-hidden', show);
                if (closedIcon) closedIcon.classList.toggle('password-icon-state-hidden', !show);
            });
        });

        form.addEventListener('submit', async event => {
            event.preventDefault();

            const newPassword = newPasswordInput.value.trim();
            const confirmPassword = confirmPasswordInput.value.trim();

            if (newPassword.length < 6) {
                setFeedback('Password baru minimal 6 karakter.', 'error');
                newPasswordInput.focus();
                return;
            }
            if (newPassword !== confirmPassword) {
                setFeedback('Konfirmasi password belum sama.', 'error');
                confirmPasswordInput.focus();
                return;
            }

            const submitButton = form.querySelector('.login-submit');
            submitButton.disabled = true;
            submitButton.setAttribute('aria-busy', 'true');

            try {
                const response = await fetch(`${API_BASE}/api/auth/change-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ new_password: newPassword })
                });

                const rawBody = await response.text();
                let data = {};
                try { data = rawBody ? JSON.parse(rawBody) : {}; } catch (_) {}

                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = 'login.html';
                        return;
                    }
                    setFeedback(data.detail || `Gagal mengganti password (HTTP ${response.status}).`, 'error');
                    return;
                }

                setFeedback('Password berhasil diperbarui. Mengarahkan ke pengaturan...', 'success');
                setTimeout(() => { window.location.href = 'settings.html'; }, 1400);
            } catch (_) {
                setFeedback('Tidak bisa terhubung ke backend.', 'error');
            } finally {
                submitButton.disabled = false;
                submitButton.removeAttribute('aria-busy');
            }
        });
    </script>
</body>

</html>

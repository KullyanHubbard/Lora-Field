<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="LoraField - Monitoring detail sensor lahan pertanian dan riwayat data.">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LoraField">
    <script>
        try {
            document.documentElement.dataset.theme = localStorage.getItem('lf_theme') === 'light' ? 'light' : 'dark';
        } catch (error) {
            document.documentElement.dataset.theme = 'dark';
        }
    </script>
    <title>LoraField</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f9f6e'/%3E%3Cpath d='M18 39c14-1 22-8 28-22 1 17-7 29-24 31-4-2-6-5-4-9z' fill='white'/%3E%3C/svg%3E">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/premium.css">

    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
        media="print" onload="this.media='all'">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
        media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap">
    </noscript>
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <!-- Ambient Background -->
    <div class="ambient-bg">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="ambient-orb orb-3"></div>
    </div>
    <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
        <div class="sidebar-brand">
            <h2><i class="fas fa-seedling" aria-hidden="true"></i> LoraField</h2>
            <p>LoRa-Based Precision Agriculture System</p>
        </div>
        <nav class="sidebar-nav" aria-label="Menu aplikasi"></nav>
        <div class="sidebar-footer">LoraField v1.5 Beta &middot; CDP 2026</div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-toggle" id="sidebar-toggle" type="button" aria-label="Buka navigasi" aria-controls="sidebar">
                    <i class="fas fa-bars" aria-hidden="true"></i>
                </button>
            </div>
            <div class="topbar-right">
                <span class="topbar-clock" id="realtime-clock"></span>
            </div>
        </header>

        <div class="page-content">
            <div class="card toolbar-card mb-24">
                <div class="flex-between">
                    <div class="toolbar-controls">
                        <div class="form-group">
                            <label for="filter-node">Node</label>
                            <select class="form-control" id="filter-node"></select>
                        </div>
                    </div>
                    <button class="btn btn-secondary" type="button" id="monitoring-refresh">
                        <i class="fas fa-sync-alt" aria-hidden="true"></i> Muat Ulang Data
                    </button>
                </div>
            </div>

            <div class="grid-2 mb-24">
                <div class="card"><div class="card-header"><h3>Kelembapan Tanah</h3></div><div class="chart-wrap"><canvas id="mon-chart-soil"></canvas></div></div>
                <div class="card"><div class="card-header"><h3>Suhu Tanah</h3></div><div class="chart-wrap"><canvas id="mon-chart-soil-temp"></canvas></div></div>
                <div class="card"><div class="card-header"><h3>Suhu Udara</h3></div><div class="chart-wrap"><canvas id="mon-chart-air-temp"></canvas></div></div>
                <div class="card"><div class="card-header"><h3>Kelembapan Udara</h3></div><div class="chart-wrap"><canvas id="mon-chart-air-hum"></canvas></div></div>
            </div>

            <div class="card">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Waktu</th>
                                <th>Node</th>
                                <th>Kelembapan Tanah</th>
                                <th>Suhu Tanah</th>
                                <th>Suhu Udara</th>
                                <th>Kelembapan Udara</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="mon-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="js/dummy-data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/simulation.js"></script>
    <script>
        let selectedNodeId = '';
        let monTableData = [];

        const nodeSelect = document.getElementById('filter-node');

        function getMonitoringNodes() {
            return getFarmNodes(getCurrentFarm());
        }

        function initMonitoringFilters() {
            const farmNodes = getMonitoringNodes();
            if (farmNodes.length) selectedNodeId = farmNodes[0].id;

            if (!farmNodes.length) {
                nodeSelect.innerHTML = '<option value="">Tidak ada node</option>';
                nodeSelect.disabled = true;
                return;
            }

            nodeSelect.disabled = false;
            nodeSelect.innerHTML = farmNodes.map(node => {
                return `<option value="${escapeHtml(node.id)}">${escapeHtml(node.name)} - ${escapeHtml(node.location)}</option>`;
            }).join('');
            nodeSelect.value = selectedNodeId;
        }

        nodeSelect.addEventListener('change', event => {
            selectedNodeId = event.target.value;
            updateMonitoringUI();
        });

        function getSelectedNode() {
            const nodes = getMonitoringNodes();
            return nodes.find(node => node.id === selectedNodeId) || nodes[0] || null;
        }

        function updateMonitoringUI() {
            const node = getSelectedNode();
            if (!node) {
                document.getElementById('mon-table-body').innerHTML = '<tr><td colspan="7" class="text-center text-muted">Tidak ada node untuk kebun ini.</td></tr>';
                return;
            }
            selectedNodeId = node.id;
            nodeSelect.value = node.id;

            if (node.status !== 'offline') {
                updateMonitoringCharts();

                const now = new Date();
                monTableData.unshift({
                    time: now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                    node: node.name,
                    soil: node.soilMoisture + '%',
                    stemp: node.soilTemp + DEG_C,
                    atemp: node.airTemp + DEG_C,
                    ahum: node.airHumidity + '%',
                    status: node.status
                });
                if (monTableData.length > 20) monTableData.pop();
            }

            const tbody = document.getElementById('mon-table-body');
            tbody.innerHTML = monTableData.slice(0, 10).map(row => {
                const rowBadge = getNodeStatusBadge(row.status);
                return `<tr>
                    <td class="data-value">${row.time}</td>
                    <td>${escapeHtml(row.node)}</td>
                    <td class="data-value">${row.soil}</td>
                    <td class="data-value">${row.stemp}</td>
                    <td class="data-value">${row.atemp}</td>
                    <td class="data-value">${row.ahum}</td>
                    <td><span class="badge ${rowBadge.className}">${rowBadge.label}</span></td>
                </tr>`;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            initMonitoringFilters();
            document.getElementById('monitoring-refresh').addEventListener('click', updateMonitoringUI);
            initMonitoringCharts();
            updateMonitoringUI();
            startSimulation();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Daftar kebun milik user LoraField.">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <script>
        try {
            document.documentElement.dataset.theme = localStorage.getItem('lf_theme') === 'light' ? 'light' : 'dark';
        } catch (error) {
            document.documentElement.dataset.theme = 'dark';
        }
    </script>
    <title>Kebun Saya - LoraField</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f9f6e'/%3E%3Cpath d='M18 39c14-1 22-8 28-22 1 17-7 29-24 31-4-2-6-5-4-9z' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/premium.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </noscript>
</head>

<body>
    <div class="ambient-bg">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="ambient-orb orb-3"></div>
    </div>
    <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
        <div class="sidebar-brand">
            <h2><i class="fas fa-seedling" aria-hidden="true"></i> LoraField</h2>
            <p>LoRa-Based Precision Agriculture System</p>
        </div>
        <nav class="sidebar-nav" aria-label="Menu aplikasi">
            <a href="farm-detail.html" class="sidebar-link"><i class="fas fa-th-large" aria-hidden="true"></i> Dashboard</a>
            <a href="index.html" class="sidebar-link active" aria-current="page"><i class="fas fa-map-location-dot"
                    aria-hidden="true"></i> Kebun Saya</a>
            <a href="monitoring.html" class="sidebar-link"><i class="fas fa-chart-area" aria-hidden="true"></i>
                Monitoring</a>
            <a href="irrigation.html" class="sidebar-link"><i class="fas fa-tint" aria-hidden="true"></i> Irigasi</a>
            <a href="gateway.html" class="sidebar-link"><i class="fas fa-tower-broadcast" aria-hidden="true"></i>
                Gateway</a>
            <a href="nodes.html" class="sidebar-link"><i class="fas fa-microchip" aria-hidden="true"></i> Node Sensor</a>
            <a href="weather.html" class="sidebar-link"><i class="fas fa-cloud-sun" aria-hidden="true"></i> Cuaca</a>
            <a href="logs.html" class="sidebar-link"><i class="fas fa-list-alt" aria-hidden="true"></i> Riwayat</a>
            <a href="settings.html" class="sidebar-link"><i class="fas fa-gear" aria-hidden="true"></i> Settings</a>
        </nav>
        <div class="sidebar-footer">LoraField v0.1-alpha &middot; CDP 2025</div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-toggle" id="sidebar-toggle" type="button" aria-label="Buka navigasi"
                    aria-controls="sidebar">
                    <i class="fas fa-bars" aria-hidden="true"></i>
                </button>
                <span class="topbar-title">
                    <span class="topbar-title-full">Kebun Saya</span>
                    <span class="topbar-title-short">Kebun</span>
                </span>
            </div>
            <div class="topbar-right">
                <span class="topbar-clock" id="realtime-clock"></span>
                <span class="badge badge-green badge-online">Online</span>
            </div>
        </header>

        <div class="page-content">
            <section class="page-header">
                <div>
                    <span class="page-kicker">Kebun Saya</span>
                    <h1 id="farms-title">Daftar Kebun</h1>
                    <p>Data kebun dibatasi sesuai akun yang sedang login.</p>
                </div>
                <div class="page-header-actions">
                    <span class="status-pill"><i class="fas fa-user-lock" aria-hidden="true"></i> Pak Budi</span>
                </div>
            </section>

            <div class="card toolbar-card mb-24">
                <div class="flex-between">
                    <label class="search-box farm-search-list" for="farm-list-search">
                        <i class="fas fa-search" aria-hidden="true"></i>
                        <input type="text" id="farm-list-search" placeholder="Cari kebun, lokasi, atau tanaman">
                    </label>
                    <span class="badge badge-green" id="farm-list-count">0 Kebun</span>
                </div>
            </div>

            <section class="farm-card-grid" id="farm-list" aria-label="Daftar kebun"></section>
        </div>
    </main>

    <script src="js/dummy-data.js"></script>
    <script src="js/main.js"></script>
    <script>
        let farmFilter = '';

        function getVisibleFarms() {
            const keyword = farmFilter.trim().toLowerCase();
            if (!keyword) return FARMS;
            return FARMS.filter(farm => {
                return farm.name.toLowerCase().includes(keyword) ||
                    farm.location.toLowerCase().includes(keyword) ||
                    farm.crop.toLowerCase().includes(keyword);
            });
        }

        function renderFarmList() {
            const farms = getVisibleFarms();
            document.getElementById('farm-list-count').textContent = `${farms.length} Kebun`;
            document.getElementById('farms-title').textContent = `Daftar Kebun ${CURRENT_USER.name}`;

            const list = document.getElementById('farm-list');
            list.innerHTML = farms.map(farm => {
                return `<article class="farm-card">
                    <div class="farm-card-header">
                        <div>
                            <h3>${farm.name}</h3>
                            <span>${farm.owner}</span>
                        </div>
                        <span class="badge badge-green">Akses Aktif</span>
                    </div>
                    <div class="farm-card-body">
                        <div><span>Lokasi Kebun</span><strong>${farm.location}</strong></div>
                        <div><span>Jenis Tanaman</span><strong>${farm.crop}</strong></div>
                        <div><span>Luas Lahan</span><strong>${farm.area}</strong></div>
                    </div>
                    <div class="farm-card-actions">
                        <a class="btn btn-primary btn-sm" href="farm-detail.html?farm=${farm.id}" data-farm-detail="${farm.id}">
                            <i class="fas fa-arrow-right" aria-hidden="true"></i> Lihat Detail
                        </a>
                    </div>
                </article>`;
            }).join('') || '<div class="empty-state">Kebun tidak ditemukan.</div>';
        }

        document.addEventListener('click', event => {
            const detailLink = event.target.closest('[data-farm-detail]');
            if (detailLink) setSelectedFarmId(detailLink.dataset.farmDetail);
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderFarmList();
            document.getElementById('farm-list-search').addEventListener('input', event => {
                farmFilter = event.target.value;
                renderFarmList();
            });
        });
    </script>
</body>

</html>

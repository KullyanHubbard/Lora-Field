<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Daftar kebun milik user LoraField.">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <script>
        try {
            document.documentElement.dataset.theme = localStorage.getItem('lf_theme') === 'light' ? 'light' : 'dark';
        } catch (error) {
            document.documentElement.dataset.theme = 'dark';
        }
    </script>
    <title>Kebun Saya - LoraField</title>
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/premium.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </noscript>
</head>

<body>
    <div class="ambient-bg">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="ambient-orb orb-3"></div>
    </div>
    <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
        <div class="sidebar-brand">
            <h2 class="sidebar-brand-title">
                <img src="img/logo.svg" class="brand-logo" alt="">
                <span class="brand-name">LoraField</span>
            </h2>
            
        </div>
        <nav class="sidebar-nav" aria-label="Menu aplikasi"></nav>
        <div class="sidebar-footer">LoraField v1.5 Beta &middot; CDP 2026</div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-toggle" id="sidebar-toggle" type="button" aria-label="Buka navigasi"
                    aria-controls="sidebar">
                    <i class="fas fa-bars" aria-hidden="true"></i>
                </button>
            </div>
            <div class="topbar-right">
                <span class="topbar-clock" id="realtime-clock"></span>
            </div>
        </header>

        <div class="page-content">
            <div class="card toolbar-card mb-24">
                <div class="flex-between">
                    <label class="search-box farm-search-list" for="farm-list-search">
                        <i class="fas fa-search" aria-hidden="true"></i>
                        <input type="text" id="farm-list-search" placeholder="Cari kebun, lokasi, atau tanaman">
                    </label>
                </div>
            </div>

            <section class="farm-card-grid" id="farm-list" aria-label="Daftar kebun"></section>
        </div>
    </main>

    <script src="js/dummy-data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        let farmFilter = '';

        function getVisibleFarms() {
            const keyword = farmFilter.trim().toLowerCase();
            if (!keyword) return FARMS;
            return FARMS.filter(farm => {
                return farm.name.toLowerCase().includes(keyword) ||
                    farm.location.toLowerCase().includes(keyword) ||
                    farm.crop.toLowerCase().includes(keyword);
            });
        }

        function renderFarmList() {
            const farms = getVisibleFarms();

            const list = document.getElementById('farm-list');
            list.innerHTML = farms.map(farm => {
                return `<article class="farm-card">
                    <div class="farm-card-header">
                        <div>
                            <h3>${escapeHtml(farm.name)}</h3>
                            <span>${escapeHtml(farm.owner)}</span>
                        </div>
                        <span class="badge badge-green">Akses Aktif</span>
                    </div>
                    <div class="farm-card-body">
                        <div><span>Lokasi Kebun</span><strong>${escapeHtml(farm.location)}</strong></div>
                        <div><span>Jenis Tanaman</span><strong>${escapeHtml(farm.crop)}</strong></div>
                        <div><span>Luas Lahan</span><strong>${escapeHtml(farm.area)}</strong></div>
                    </div>
                    <div class="farm-card-actions">
                        <a class="btn btn-primary btn-sm" href="farm-detail.html?farm=${encodeURIComponent(farm.id)}" data-farm-detail="${escapeHtml(farm.id)}">
                            <i class="fas fa-arrow-right" aria-hidden="true"></i> Lihat Detail
                        </a>
                    </div>
                </article>`;
            }).join('') || '<div class="empty-state">Kebun tidak ditemukan.</div>';
        }

        document.addEventListener('click', event => {
            const detailLink = event.target.closest('[data-farm-detail]');
            if (detailLink) setSelectedFarmId(detailLink.dataset.farmDetail);
        });

        document.addEventListener('DOMContentLoaded', async () => {
            const list = document.getElementById('farm-list');
            if (list) list.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Memuat data kebun...</div>';

            await loadFarmsFromAPI();
            renderFarmList();
            document.getElementById('farm-list-search').addEventListener('input', event => {
                farmFilter = event.target.value;
                renderFarmList();
            });
        });
    </script>
</body>

</html>

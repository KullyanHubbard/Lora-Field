<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description"
        content="LoraField - Dashboard monitoring lahan pertanian, sensor tanah, cuaca, dan status irigasi berbasis LoRa P2P.">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LoraField">
    <script>
        try {
            document.documentElement.dataset.theme = localStorage.getItem('lf_theme') === 'light' ? 'light' : 'dark';
        } catch (error) {
            document.documentElement.dataset.theme = 'dark';
        }
    </script>
    <title>Pilih Kebun - LoraField</title>
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/premium.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
        media="print" onload="this.media='all'">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
        media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap">
    </noscript>
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body>
    <div class="ambient-bg">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="ambient-orb orb-3"></div>
    </div>
    <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
        <div class="sidebar-brand">
            <h2 class="sidebar-brand-title">
                <img src="img/logo.svg" class="brand-logo" alt="">
                <span class="brand-name">LoraField</span>
            </h2>
            
        </div>
        <nav class="sidebar-nav" aria-label="Menu aplikasi"></nav>
        <div class="sidebar-footer">LoraField v1.5 Beta &middot; CDP 2026</div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-toggle" id="sidebar-toggle" type="button" aria-label="Buka navigasi"
                    aria-controls="sidebar">
                    <i class="fas fa-bars" aria-hidden="true"></i>
                </button>
            </div>
            <div class="topbar-right">
                <span class="topbar-clock" id="realtime-clock"></span>
            </div>
        </header>

        <div class="page-content">
            <section class="field-map-panel mb-24" aria-label="Peta pemilihan kebun">
                <div class="farm-map-toolbar">
                    <label class="search-box farm-search" for="farm-search">
                        <i class="fas fa-search" aria-hidden="true"></i>
                        <input type="text" id="farm-search" placeholder="Cari nama kebun, lokasi, atau tanaman">
                    </label>
                    <a class="btn btn-primary btn-sm" href="add-farm.html">
                        <i class="fas fa-plus" aria-hidden="true"></i> Tambah Kebun
                    </a>
                </div>

                <div class="field-osm-map farm-osm-map" id="farm-map" aria-label="Peta lokasi kebun"></div>
            </section>

            <section class="farm-card-grid" id="farm-list" aria-label="Daftar kebun milik user"></section>
        </div>
    </main>

    <!-- Modal konfirmasi hapus kebun -->
    <div class="confirm-overlay" id="delete-confirm-overlay" hidden aria-modal="true" role="dialog" aria-labelledby="delete-confirm-title">
        <div class="confirm-dialog">
            <h3 class="confirm-title" id="delete-confirm-title"><i class="fas fa-triangle-exclamation"></i> Hapus Kebun</h3>
            <p class="confirm-body" id="delete-confirm-body">Yakin ingin menghapus kebun ini? Data kebun akan hilang permanen dan tidak bisa dikembalikan.</p>
            <div class="confirm-actions">
                <button class="btn btn-secondary" id="delete-cancel-btn" type="button">Batal</button>
                <button class="btn btn-danger" id="delete-confirm-btn" type="button">Ya, Hapus</button>
            </div>
        </div>
    </div>

    <script src="js/dummy-data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        let farmMap = null;
        let farmLayer = null;
        let selectedFarmId = getSelectedFarmId();
        let currentFarmFilter = '';

        function getVisibleFarms() {
            const keyword = currentFarmFilter.trim().toLowerCase();
            if (!keyword) return FARMS;
            return FARMS.filter(farm =>
                farm.name.toLowerCase().includes(keyword) ||
                farm.location.toLowerCase().includes(keyword) ||
                farm.crop.toLowerCase().includes(keyword)
            );
        }

        function getFarmCardClass(farm) {
            return farm.id === selectedFarmId ? 'farm-card is-selected' : 'farm-card';
        }

        function renderFarmCards() {
            const farms = getVisibleFarms();
            const list = document.getElementById('farm-list');
            if (!list) return;

            list.innerHTML = farms.map(farm => `<article class="${getFarmCardClass(farm)}" data-farm-card="${escapeHtml(farm.id)}" tabindex="0" role="link" aria-label="Buka dashboard ${escapeHtml(farm.name)}">
                <div class="farm-card-header">
                    <div>
                        <h3>${escapeHtml(farm.name)}</h3>
                        <span>${escapeHtml(farm.owner)}</span>
                    </div>
                    <span class="badge badge-green">Akses Aktif</span>
                </div>
                <div class="farm-card-body">
                    <div><span>Lokasi Kebun</span><strong>${escapeHtml(farm.location)}</strong></div>
                    <div><span>Jenis Tanaman</span><strong>${escapeHtml(farm.crop)}</strong></div>
                    <div><span>Luas Lahan</span><strong>${escapeHtml(farm.area)}</strong></div>
                </div>
                <div class="farm-card-actions">
                    <a class="btn btn-primary btn-sm" href="farm-detail.html?farm=${encodeURIComponent(farm.id)}" data-farm-detail="${escapeHtml(farm.id)}">
                        <i class="fas fa-arrow-right" aria-hidden="true"></i> Buka Dashboard
                    </a>
                    <button class="btn btn-danger btn-sm" type="button" data-farm-delete="${escapeHtml(farm.id)}" aria-label="Hapus kebun ${escapeHtml(farm.name)}">
                        <i class="fas fa-trash" aria-hidden="true"></i>
                    </button>
                </div>
            </article>`).join('') || '<div class="empty-state">Kebun tidak ditemukan.</div>';
        }

        function buildFarmPopup(farm) {
            return `<div class="lf-popup-inner">
                <strong class="lf-pop-title">${escapeHtml(farm.name)}</strong>
                <a class="btn btn-primary btn-sm lf-pop-action" href="farm-detail.html?farm=${encodeURIComponent(farm.id)}" data-farm-detail="${escapeHtml(farm.id)}">Buka Dashboard</a>
            </div>`;
        }

        function createFarmIcon(farm) {
            const isSelected = farm.id === selectedFarmId ? ' is-selected' : '';
            const statusClass = farm.gateway.status === 'online' ? 'lf-marker-farm-online' : 'lf-marker-farm-offline';
            return L.divIcon({
                className: '',
                html: `<div class="lf-marker lf-marker-farm ${statusClass}${isSelected}"><img src="img/logo.svg" class="marker-logo" alt=""></div>`,
                iconSize: [38, 38],
                iconAnchor: [19, 19],
                popupAnchor: [0, -22]
            });
        }

        function renderFarmMapMarkers() {
            if (!farmMap || !farmLayer) return;
            farmLayer.clearLayers();

            const farms = getVisibleFarms();
            farms.forEach(farm => {
                const marker = L.marker([farm.latitude, farm.longitude], { icon: createFarmIcon(farm) })
                    .bindPopup(buildFarmPopup(farm), { className: 'lf-popup', maxWidth: 280 })
                    .on('click', () => selectFarm(farm.id, false));
                farmLayer.addLayer(marker);
            });

            if (farms.length) {
                const bounds = L.latLngBounds(farms.map(farm => [farm.latitude, farm.longitude]));
                farmMap.fitBounds(bounds.pad(0.22));
            }
        }

        function initFarmMap() {
            if (!window.L) {
                const map = document.getElementById('farm-map');
                if (map) map.innerHTML = '<div class="empty-state">Map belum tersedia.</div>';
                return;
            }

            farmMap = L.map('farm-map', {
                center: [-7.79, 110.3],
                zoom: 9,
                zoomControl: true,
                attributionControl: true,
                scrollWheelZoom: false
            });

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(farmMap);

            farmLayer = L.layerGroup().addTo(farmMap);
            renderFarmMapMarkers();
        }

        function selectFarm(farmId, shouldRenderMap = true) {
            selectedFarmId = farmId;
            setSelectedFarmId(farmId);
            renderFarmCards();
            if (shouldRenderMap) renderFarmMapMarkers();
        }

        function bindDashboardEvents() {
            const search = document.getElementById('farm-search');
            if (search) {
                search.addEventListener('input', event => {
                    currentFarmFilter = event.target.value;
                    renderFarmCards();
                    renderFarmMapMarkers();
                });
            }

            let pendingDeleteId = null;

            function openDeleteConfirm(farmId) {
                const farm = FARMS.find(f => f.id === farmId);
                pendingDeleteId = farmId;
                const body = document.getElementById('delete-confirm-body');
                if (body && farm) body.textContent = `Yakin ingin menghapus kebun "${farm.name}"? Data kebun akan hilang permanen dan tidak bisa dikembalikan.`;
                document.getElementById('delete-confirm-overlay').hidden = false;
                document.getElementById('delete-cancel-btn').focus();
            }

            function closeDeleteConfirm() {
                pendingDeleteId = null;
                document.getElementById('delete-confirm-overlay').hidden = true;
            }

            document.getElementById('delete-cancel-btn').addEventListener('click', closeDeleteConfirm);

            document.getElementById('delete-confirm-overlay').addEventListener('click', e => {
                if (e.target === e.currentTarget) closeDeleteConfirm();
            });

            document.getElementById('delete-confirm-btn').addEventListener('click', async () => {
                if (!pendingDeleteId) return;
                const farmId = pendingDeleteId;
                closeDeleteConfirm();

                try {
                    const res = await fetch(`${API_BASE}/api/farms/${encodeURIComponent(farmId)}`, {
                        method: 'DELETE',
                        headers: getAuthHeaders()
                    });
                    if (res.ok) {
                        await loadFarmsFromAPI();
                        selectedFarmId = getSelectedFarmId();
                        renderFarmCards();
                        renderFarmMapMarkers();
                    } else if (res.status === 401) {
                        window.location.href = 'login.html';
                    }
                } catch (_) {}
            });

            document.addEventListener('click', event => {
                const deleteBtn = event.target.closest('[data-farm-delete]');
                if (deleteBtn) {
                    event.stopPropagation();
                    openDeleteConfirm(deleteBtn.dataset.farmDelete);
                    return;
                }

                const selectButton = event.target.closest('[data-farm-select]');
                if (selectButton) {
                    selectFarm(selectButton.dataset.farmSelect);
                    return;
                }

                const detailLink = event.target.closest('[data-farm-detail]');
                if (detailLink) {
                    setSelectedFarmId(detailLink.dataset.farmDetail);
                    return;
                }

                const farmCard = event.target.closest('[data-farm-card]');
                if (farmCard && !event.target.closest('a, button')) {
                    const farmId = farmCard.dataset.farmCard;
                    setSelectedFarmId(farmId);
                    window.location.href = `farm-detail.html?farm=${farmId}`;
                }
            });

            document.addEventListener('keydown', event => {
                if (event.key !== 'Enter' && event.key !== ' ') return;
                const farmCard = event.target.closest('[data-farm-card]');
                if (!farmCard) return;
                event.preventDefault();
                const farmId = farmCard.dataset.farmCard;
                setSelectedFarmId(farmId);
                window.location.href = `farm-detail.html?farm=${farmId}`;
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // Tampilkan loading sementara
            const list = document.getElementById('farm-list');
            if (list) list.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Memuat data kebun...</div>';

            // Load data real dari backend; jika gagal, dummy-data.js tetap jadi fallback
            await loadFarmsFromAPI();

            // Perbarui selectedFarmId karena FARMS sudah berisi data real
            selectedFarmId = getSelectedFarmId();

            renderFarmCards();
            initFarmMap();
            bindDashboardEvents();
        });
    </script>
</body>

</html>

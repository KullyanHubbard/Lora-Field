<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LoraField Dashboard</title>
  </head>
  <body>
    <p>
      Membuka dashboard...
      <a id="dashboard-link" href="static/index.html">Klik di sini jika tidak berpindah otomatis.</a>
    </p>
    <script>
      const isSourceFile = window.location.pathname.includes('/frontend/');
      const target = isSourceFile ? 'public/static/index.html' : 'static/index.html';
      const targetUrl = new URL(target, window.location.href);
      const fallbackLink = document.getElementById('dashboard-link');

      if (fallbackLink) {
        fallbackLink.href = targetUrl.href;
      }

      window.location.replace(targetUrl.href);
    </script>
  </body>
</html>

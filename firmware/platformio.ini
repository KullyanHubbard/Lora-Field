; Firmware LoraField: gateway dan node sensor untuk LilyGO LoRa32 (ESP32).
; Format MQTT gateway mengikuti docs/kontrak-mqtt.md.
;
;   pio run -e gateway -e node   compile kedua firmware
;   pio test -e native           tes logika di PC, tanpa alat

[platformio]
default_envs = gateway, node

[esp32]
platform = espressif32@6.12.0
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
lib_deps =
    sandeepmistry/LoRa@^0.8.0
    bblanchon/ArduinoJson@^7.2.0

[env:gateway]
extends = esp32
build_src_filter = +<gateway/>
; Teks portal WiFi dalam Bahasa Indonesia (include/wm_strings_id.h). -Iinclude supaya library
; WiFiManager ikut menemukan file itu.
build_flags =
    -Iinclude
    -DWM_STRINGS_FILE=\"wm_strings_id.h\"
; Halaman portal WiFi dan font Geist ikut tertanam di firmware (HP di hotspot tidak punya internet).
board_build.embed_txtfiles = portal/index.html
board_build.embed_files = portal/geist-latin-wght-normal.woff2
lib_deps =
    ${esp32.lib_deps}
    knolleary/PubSubClient@^2.8
    tzapu/WiFiManager@^2.0.17

[env:node]
extends = esp32
build_src_filter = +<node/>
lib_deps =
    ${esp32.lib_deps}
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

[env:native]
platform = native
test_framework = unity
lib_deps = bblanchon/ArduinoJson@^7.2.0
